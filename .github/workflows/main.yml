name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Localizar el proyecto Android
        run: |
          SETTINGS=$(find . -name "settings.gradle*" -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle. Contenido del repo:"
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Proyecto en: $(dirname "$SETTINGS")"

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Reunir APK
        run: |
          mkdir -p salida
          find . -path "*outputs/apk*" -name "*.apk" -exec cp {} salida/ \;
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: La_Balsera-apk
          path: salida/*.apk
